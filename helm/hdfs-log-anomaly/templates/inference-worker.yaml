{{- if .Values.streaming.inferenceWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hdfs-log-anomaly.name" . }}-inference-worker
spec:
  replicas: {{ .Values.streaming.inferenceWorker.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "hdfs-log-anomaly.name" . }}-inference-worker
  template:
    metadata:
      labels:
        app: {{ include "hdfs-log-anomaly.name" . }}-inference-worker
    spec:
      serviceAccountName: {{ include "hdfs-log-anomaly.serviceAccountName" . }}
      initContainers:
        - name: model-downloader
          image: google/cloud-sdk:slim
          command: ["sh", "-c"]
          args:
            - |
              echo "Checking if model files exist in GCS..."
              gsutil -q stat gs://${GCS_ARTIFACTS_BUCKET}/models/model.pt
              if [ $? -eq 0 ]; then
                echo "Downloading model artifacts from gs://${GCS_ARTIFACTS_BUCKET}/models/..."
                gsutil cp gs://${GCS_ARTIFACTS_BUCKET}/models/model.pt /shared-artifacts/model.pt
                gsutil cp gs://${GCS_ARTIFACTS_BUCKET}/models/vocab.json /shared-artifacts/vocab.json
              else
                echo "Model artifacts not found in GCS models/ folder. System will start in Fallback Rule mode."
              fi
          env:
            - name: GCS_ARTIFACTS_BUCKET
              value: {{ .Values.env.GCS_ARTIFACTS_BUCKET | quote }}
          volumeMounts:
            - name: shared-model-volume
              mountPath: /shared-artifacts
      containers:
        - name: inference-worker
          image: "{{ .Values.streamingImage.repository }}:{{ .Values.streamingImage.tag }}"
          imagePullPolicy: {{ .Values.streamingImage.pullPolicy }}
          command: ["python", "-m", "app.workers.inference_worker"]
          env:
{{ range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
{{ end }}
          envFrom:
            - secretRef:
                name: {{ .Values.secret.name }}
                optional: true
          volumeMounts:
            - name: shared-model-volume
              mountPath: /app/artifacts
          resources:
            {{- toYaml .Values.workerResources | nindent 12 }}
      volumes:
        - name: shared-model-volume
          emptyDir: {}
{{- end }}

