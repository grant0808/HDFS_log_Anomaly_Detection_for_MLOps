services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      POSTGRES_DSN: postgresql+psycopg://hdfs:hdfs@postgres:5432/hdfs
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    depends_on: [postgres, redis, kafka, clickhouse, mailhog]
  inference-worker:
    profiles: ["streaming"]
    build:
      context: .
      dockerfile: Dockerfile.streaming
    command: python -m app.workers.inference_worker
    environment:
      POSTGRES_DSN: postgresql+psycopg://hdfs:hdfs@postgres:5432/hdfs
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FEATURE_TOPIC: hdfs.feature.windows
      ANOMALY_TOPIC: hdfs.anomalies
      INFERENCE_TOPIC: hdfs.inference.history
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_ENABLED: "true"
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    depends_on: [postgres, redis, kafka, clickhouse]
    restart: on-failure
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hdfs
      POSTGRES_PASSWORD: hdfs
      POSTGRES_DB: hdfs
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports: ["8123:8123", "9000:9000"]
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    command: mlflow server --host 0.0.0.0 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlruns
    ports: ["5000:5000"]
  prometheus:
    image: prom/prometheus:v2.52.0
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:10.4.2
    ports: ["3000:3000"]
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ["1025:1025", "8025:8025"]
